<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Cavern | My Online Game</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{background:radial-gradient(circle at top,#263a64,#0d1325 72%);color:#fff;margin:0;min-height:100vh}main{margin:auto;max-width:700px;padding:24px 16px 42px;text-align:center}a{color:#ffd45a}h1{font-size:clamp(2.5rem,8vw,4.7rem);letter-spacing:-.08em;margin:14px 0 4px}.tagline{color:#c8d8f0}.panel{background:#151e37e8;border:1px solid #ffffff30;border-radius:18px;padding:18px}.hud{display:flex;justify-content:space-around;margin:12px}.hud strong{color:#73e7ff;display:block;font-size:1.35rem}.grid{display:grid;gap:5px;grid-template-columns:repeat(12,1fr);margin:auto;max-width:600px}.tile{align-items:center;background:#24395d;border:1px solid #ffffff18;border-radius:5px;display:flex;font-size:clamp(1.1rem,5vw,2rem);justify-content:center;aspect-ratio:1}.wall{background:#111b30}.player{background:#166a79}.crystal{background:#553c82;box-shadow:0 0 12px #9d7cff}.exit{background:#806a26}.monster{background:#6c304b}.help,#status{color:#c8d8f0;line-height:1.5}.button{background:#ffd45a;border:0;border-radius:9px;color:#17203b;cursor:pointer;font:inherit;font-weight:bold;padding:10px 16px}
</style></head>
<body><main><a href="index.html">← Back to games</a><h1>Crystal Cavern</h1><p class="tagline">Collect every crystal, outsmart the cave beast, and escape.</p><section class="panel"><button id="start" class="button" type="button">Enter cavern</button><div class="hud"><div>Level<strong id="level">1</strong></div><div>Crystals<strong id="score">0 / 6</strong></div><div>Lives<strong id="lives">3</strong></div></div><div id="grid" class="grid" aria-label="Crystal Cavern map"></div><p id="status" role="status">Use the arrow keys to explore.</p><p class="help">Arrow keys move. The beast moves faster at higher levels. Find the exit after collecting every crystal.</p></section></main>
<script>
const grid=document.querySelector("#grid"),start=document.querySelector("#start"),status=document.querySelector("#status"),scoreEl=document.querySelector("#score"),livesEl=document.querySelector("#lives"),levelEl=document.querySelector("#level"),W=12,H=8;let player,monster,crystals,active=false,lives=3,level=1,goal=6;
const walls=new Set(["2,1","2,2","2,3","5,0","5,1","5,2","8,5","8,6","8,7","3,6","4,6","5,6","10,2","10,3"]);
const crystalPool=["3,0","7,1","10,1","1,4","6,4","9,4","2,7","7,7","11,4","9,0"];
function key(x,y){return`${x},${y}`}function open(x,y){return x>=0&&x<W&&y>=0&&y<H&&!walls.has(key(x,y))}
function draw(){grid.innerHTML="";for(let y=0;y<H;y++)for(let x=0;x<W;x++){const tile=document.createElement("div");tile.className="tile";if(walls.has(key(x,y)))tile.classList.add("wall"),tile.textContent="🪨";else if(player.x===x&&player.y===y)tile.classList.add("player"),tile.textContent="🧭";else if(monster.x===x&&monster.y===y)tile.classList.add("monster"),tile.textContent="👾";else if(x===W-2&&y===H-2)tile.classList.add("exit"),tile.textContent="🚪";else if(crystals.has(key(x,y)))tile.classList.add("crystal"),tile.textContent="✦";grid.append(tile)}levelEl.textContent=level;scoreEl.textContent=`${goal-crystals.size} / ${goal}`;livesEl.textContent=lives}
function moveMonster(){for(let turn=0;turn<Math.min(level,3);turn++){const options=[[monster.x+Math.sign(player.x-monster.x),monster.y],[monster.x,monster.y+Math.sign(player.y-monster.y)],[monster.x+1,monster.y],[monster.x-1,monster.y]].filter(([x,y])=>open(x,y));if(options.length)monster=options[Math.floor(Math.random()*Math.min(2,options.length))]}}
function step(dx,dy){if(!active)return;const nx=player.x+dx,ny=player.y+dy;if(!open(nx,ny))return;player={x:nx,y:ny};if(crystals.delete(key(nx,ny)))status.textContent="Crystal collected!";moveMonster();if(player.x===monster.x&&player.y===monster.y){lives--;player={x:0,y:0};status.textContent="The beast caught you!";if(!lives)return end("The cavern beast wins.");}if(crystals.size===0&&player.x===W-2&&player.y===H-2){if(level<5){level++;loadLevel();status.textContent=`Level ${level}! The beast is faster.`;draw();return}return end("You escaped every cavern!")}draw()}
function end(message){active=false;status.textContent=message;start.textContent="Play again"}
function loadLevel(){goal=5+level;player={x:0,y:0};monster={x:W-1,y:0};crystals=new Set(crystalPool.slice(0,goal));draw()}
function startGame(){level=1;lives=3;active=true;start.textContent="Restart cavern";status.textContent="Find the crystals!";loadLevel()}
start.addEventListener("click",startGame);document.addEventListener("keydown",e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();step(...m)}});startGame();
</script></body></html>
