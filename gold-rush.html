<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Rush | My Online Game</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 50% 0, #48522d, transparent 45%),
          linear-gradient(#202a26, #0f181b);
        color: #f9f6e9;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        text-align: center;
        width: min(100%, 740px);
      }

      .back-link {
        color: #d8d6bb;
        display: inline-block;
        margin-bottom: 20px;
        text-decoration: none;
      }

      .back-link:hover,
      .back-link:focus-visible {
        color: #ffdc4b;
      }

      h1 {
        color: #ffdc4b;
        font-size: clamp(2.4rem, 8vw, 4.8rem);
        letter-spacing: -0.06em;
        margin: 0;
        text-shadow: 0 3px 0 #78580b;
      }

      .intro {
        color: #d8d6bb;
        margin: 12px auto 20px;
      }

      .scores {
        flex: 0 0 164px;
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr;
        margin: 0;
        text-align: left;
      }

      .score {
        background: rgba(7, 14, 16, 0.65);
        border: 2px solid;
        border-radius: 14px;
        padding: 12px;
      }

      .score.player-one {
        border-color: #f15b6b;
      }

      .score.player-two {
        border-color: #58c9e7;
      }

      .score strong {
        display: block;
        font-size: 1.6rem;
      }

      #status {
        font-weight: bold;
        margin: 0 0 18px;
        min-height: 1.2em;
      }

      #board {
        background: #3c3a24;
        border: 8px solid #795a30;
        border-radius: 16px;
        box-shadow: 0 12px 0 #171711;
        display: grid;
        flex: 1;
        gap: 3px;
        grid-template-columns: repeat(9, 1fr);
        min-width: 0;
        padding: 5px;
        width: auto;
      }

      .game-area {
        align-items: flex-start;
        display: flex;
        gap: 16px;
      }

      @media (max-width: 650px) {
        .game-area {
          flex-direction: column;
        }

        .scores {
          grid-template-columns: repeat(2, 1fr);
          width: 100%;
        }

        #board {
          width: 100%;
        }
      }

      .tile {
        align-items: center;
        aspect-ratio: 1;
        background:
          radial-gradient(circle at 35% 34%, rgba(255, 255, 255, 0.13) 0 4%, transparent 5%),
          #688044;
        display: flex;
        gap: 2px;
        justify-content: center;
        min-width: 0;
      }

      .tile.gold {
        background:
          radial-gradient(circle at 50% 50%, #fff3a6 0 16%, #ffdc4b 18% 33%, #a56d08 35% 43%, transparent 45%),
          #688044;
      }

      .tile.sword {
        position: relative;
      }

      .tile.sword::before {
        color: #e9f5ff;
        content: "\2694";
        font-size: clamp(1rem, 4vw, 2.2rem);
        line-height: 1;
        position: absolute;
        text-shadow: 1px 2px 0 #26323a;
        transform: rotate(-20deg);
      }

      .player {
        --hat: linear-gradient(#363c40 0 0) 50% 5% / 92% 25% no-repeat;
        height: 82%;
        min-height: 21px;
        min-width: 18px;
        position: relative;
        width: 58%;
      }

      .player::before {
        background:
          var(--hat),
          radial-gradient(circle at 34% 42%, #38271f 0 7%, transparent 8%),
          radial-gradient(circle at 66% 42%, #38271f 0 7%, transparent 8%),
          radial-gradient(ellipse at 50% 0, transparent 0 42%, #a8414e 44% 54%, transparent 56%) 50% 76% / 45% 20% no-repeat,
          #f3bf91;
        border: 1px solid #75442f;
        border-radius: 50%;
        content: "";
        height: 46%;
        left: 50%;
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        width: 46%;
      }

      .player::after {
        background: var(--shirt-color);
        border: 1px solid var(--shirt-shadow);
        border-radius: 45% 45% 18% 18%;
        bottom: 0;
        content: "";
        height: 54%;
        left: 12%;
        position: absolute;
        width: 76%;
      }

      .player-one {
        --hat:
          linear-gradient(#c93748 0 0) 50% 5% / 92% 25% no-repeat,
          linear-gradient(#8e2635 0 0) 78% 29% / 44% 9% no-repeat;
        --shirt-color: #f15b6b;
        --shirt-shadow: #8e2635;
      }

      .player-two {
        --hat:
          linear-gradient(#2998b9 0 0) 50% 5% / 92% 25% no-repeat,
          linear-gradient(#167793 0 0) 78% 29% / 44% 9% no-repeat;
        --shirt-color: #58c9e7;
        --shirt-shadow: #167793;
      }

      .player.armed {
        filter: drop-shadow(0 0 4px #ffdc4b);
      }

      .player.frozen {
        filter: grayscale(1);
        opacity: 0.55;
      }

      #power-status {
        color: #ffdc4b;
        margin: -10px 0 14px;
        min-height: 1.2em;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 24px;
      }

      #restart,
      #bot-toggle {
        background: #ffdc4b;
        border: 0;
        border-radius: 999px;
        color: #3b2a08;
        cursor: pointer;
        font: inherit;
        font-weight: bold;
        padding: 13px 24px;
      }

      #restart:hover,
      #restart:focus-visible,
      #bot-toggle:hover,
      #bot-toggle:focus-visible {
        background: #fff2a8;
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      kbd {
        background: #29312b;
        border: 1px solid #697167;
        border-radius: 4px;
        font-family: inherit;
        padding: 2px 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back-link" href="index.html">&larr; All games</a>
      <h1>Gold Rush</h1>
      <p class="intro">Race to collect 10 gold pieces first. Hold a movement key to keep moving.</p>
      <p id="status" aria-live="polite">First to 10 gold wins!</p>
      <p id="power-status" aria-live="polite"></p>
      <div class="game-area">
        <section class="scores" aria-label="Scores">
          <div class="score player-one">
            Player 1 <strong id="score-one">0 gold</strong>
            <small><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></small>
          </div>
          <div class="score player-two">
            <span id="player-two-label">Player 2</span> <strong id="score-two">0 gold</strong>
            <small id="player-two-controls"><kbd>&uarr;</kbd> <kbd>&larr;</kbd> <kbd>&darr;</kbd> <kbd>&rarr;</kbd></small>
          </div>
        </section>
        <div id="board" aria-label="Gold Rush board" role="grid"></div>
      </div>
      <div class="actions">
        <button id="restart" type="button">Play again</button>
        <button id="bot-toggle" type="button">Play vs bot</button>
      </div>
    </main>

    <script>
      const BOARD_SIZE = 9;
      const EFFECT_INTERVAL = 100;
      const BOT_MOVE_INTERVAL = 300;
      const FREEZE_DURATION = 5000;
      const MOVE_INTERVAL = 125;
      const SWORD_DURATION = 5000;
      const WINNING_SCORE = 10;
      const boardElement = document.querySelector("#board");
      const scoreOneElement = document.querySelector("#score-one");
      const scoreTwoElement = document.querySelector("#score-two");
      const playerTwoLabelElement = document.querySelector("#player-two-label");
      const playerTwoControlsElement = document.querySelector("#player-two-controls");
      const statusElement = document.querySelector("#status");
      const powerStatusElement = document.querySelector("#power-status");
      const restartButton = document.querySelector("#restart");
      const botToggleButton = document.querySelector("#bot-toggle");
      const players = [
        { name: "Player 1", className: "player-one", row: 0, column: 0, score: 0, frozenUntil: 0 },
        { name: "Player 2", className: "player-two", row: 8, column: 8, score: 0, frozenUntil: 0 }
      ];
      const controls = {
        w: [0, -1, 0],
        a: [0, 0, -1],
        s: [0, 1, 0],
        d: [0, 0, 1],
        arrowup: [1, -1, 0],
        arrowleft: [1, 0, -1],
        arrowdown: [1, 1, 0],
        arrowright: [1, 0, 1]
      };
      const heldControls = new Map();
      let gold;
      let gameOver = false;
      let sword;
      let swordExpiresAt = 0;
      let swordOwner = null;
      let botEnabled = false;
      let lastBotMove = 0;

      function playerLabel(playerIndex) {
        return botEnabled && playerIndex === 1 ? "Bot" : players[playerIndex].name;
      }

      function goldPosition() {
        let row;
        let column;

        do {
          row = Math.floor(Math.random() * BOARD_SIZE);
          column = Math.floor(Math.random() * BOARD_SIZE);
        } while (
          players.some((player) => player.row === row && player.column === column) ||
          (sword && sword.row === row && sword.column === column)
        );

        return { row, column };
      }

      function swordPosition() {
        let row;
        let column;

        do {
          row = Math.floor(Math.random() * BOARD_SIZE);
          column = Math.floor(Math.random() * BOARD_SIZE);
        } while (
          players.some((player) => player.row === row && player.column === column) ||
          (gold && gold.row === row && gold.column === column)
        );

        return { row, column };
      }

      function updatePowerStatus() {
        const now = Date.now();
        const effects = [];

        if (swordOwner !== null) {
          effects.push(`${playerLabel(swordOwner)} has the sword for ${Math.ceil((swordExpiresAt - now) / 1000)} seconds.`);
        }

        players.forEach((player, playerIndex) => {
          if (player.frozenUntil > now) {
            effects.push(`${playerLabel(playerIndex)} is frozen for ${Math.ceil((player.frozenUntil - now) / 1000)} seconds.`);
          }
        });

        powerStatusElement.textContent = effects.join(" ");
      }

      function renderGame() {
        boardElement.replaceChildren();

        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let column = 0; column < BOARD_SIZE; column += 1) {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.setAttribute("role", "gridcell");

            if (gold.row === row && gold.column === column) {
              tile.classList.add("gold");
              tile.setAttribute("aria-label", "Gold");
            }

            if (sword && sword.row === row && sword.column === column) {
              tile.classList.add("sword");
              tile.setAttribute("aria-label", "Sword");
            }

            players.forEach((player, playerIndex) => {
              if (player.row === row && player.column === column) {
                const marker = document.createElement("span");
                marker.className = `player ${player.className}${swordOwner === playerIndex ? " armed" : ""}${player.frozenUntil > Date.now() ? " frozen" : ""}`;
                marker.setAttribute("aria-label", playerLabel(playerIndex));
                tile.append(marker);
              }
            });

            boardElement.append(tile);
          }
        }

        scoreOneElement.textContent = `${players[0].score} gold`;
        scoreTwoElement.textContent = `${players[1].score} gold`;
        updatePowerStatus();
      }

      function movePlayer(playerIndex, rowChange, columnChange, isBotMove = false) {
        if (gameOver || (botEnabled && playerIndex === 1 && !isBotMove)) {
          return;
        }

        const player = players[playerIndex];
        const now = Date.now();

        if (player.frozenUntil > now) {
          statusElement.textContent = `${playerLabel(playerIndex)} is frozen and cannot move yet.`;
          updatePowerStatus();
          return;
        }

        const nextRow = player.row + rowChange;
        const nextColumn = player.column + columnChange;

        if (
          nextRow < 0 || nextRow >= BOARD_SIZE ||
          nextColumn < 0 || nextColumn >= BOARD_SIZE
        ) {
          return;
        }

        player.row = nextRow;
        player.column = nextColumn;

        if (sword && player.row === sword.row && player.column === sword.column) {
          swordOwner = playerIndex;
          swordExpiresAt = now + SWORD_DURATION;
          sword = null;
          statusElement.textContent = `${playerLabel(playerIndex)} picked up the sword!`;
        }

        if (player.row === gold.row && player.column === gold.column) {
          player.score += 1;

          if (player.score === WINNING_SCORE) {
            gameOver = true;
            heldControls.clear();
            swordOwner = null;
            swordExpiresAt = 0;
            statusElement.textContent = `${playerLabel(playerIndex)} wins the Gold Rush!`;
          } else {
            statusElement.textContent = `${playerLabel(playerIndex)} found gold!`;
            gold = goldPosition();
          }
        }

        const otherPlayerIndex = playerIndex === 0 ? 1 : 0;
        const otherPlayer = players[otherPlayerIndex];
        if (
          swordOwner === playerIndex &&
          player.row === otherPlayer.row &&
          player.column === otherPlayer.column
        ) {
          otherPlayer.frozenUntil = now + FREEZE_DURATION;
          statusElement.textContent = `${playerLabel(otherPlayerIndex)} is frozen for 5 seconds!`;
        }

        renderGame();
      }

      function updateTimedEffects() {
        const now = Date.now();
        let needsRender = false;

        if (swordOwner !== null && now >= swordExpiresAt) {
          swordOwner = null;
          swordExpiresAt = 0;
          sword = swordPosition();
          statusElement.textContent = "The sword has returned to the board!";
          needsRender = true;
        }

        players.forEach((player, playerIndex) => {
          if (player.frozenUntil && now >= player.frozenUntil) {
            player.frozenUntil = 0;
            statusElement.textContent = `${playerLabel(playerIndex)} can move again!`;
            needsRender = true;
          }
        });

        updatePowerStatus();

        if (needsRender) {
          renderGame();
        }
      }

      function restartGame() {
        players[0].row = 0;
        players[0].column = 0;
        players[0].score = 0;
        players[0].frozenUntil = 0;
        players[1].row = BOARD_SIZE - 1;
        players[1].column = BOARD_SIZE - 1;
        players[1].score = 0;
        players[1].frozenUntil = 0;
        heldControls.clear();
        gold = goldPosition();
        sword = swordPosition();
        swordOwner = null;
        swordExpiresAt = 0;
        lastBotMove = 0;
        gameOver = false;
        statusElement.textContent = "First to 10 gold wins!";
        renderGame();
      }

      function moveBot() {
        if (!botEnabled || gameOver || players[1].frozenUntil > Date.now()) {
          return;
        }

        const bot = players[1];
        let target;

        if (swordOwner === 1) {
          target = players[0];
        } else {
          const targets = [gold, ...(sword ? [sword] : [])];
          target = targets.reduce((closest, candidate) => {
            const candidateDistance = Math.abs(bot.row - candidate.row) + Math.abs(bot.column - candidate.column);
            const closestDistance = Math.abs(bot.row - closest.row) + Math.abs(bot.column - closest.column);
            return candidateDistance < closestDistance ? candidate : closest;
          });
        }

        const rowDistance = target.row - bot.row;
        const columnDistance = target.column - bot.column;

        if (Math.abs(rowDistance) >= Math.abs(columnDistance) && rowDistance !== 0) {
          movePlayer(1, Math.sign(rowDistance), 0, true);
        } else if (columnDistance !== 0) {
          movePlayer(1, 0, Math.sign(columnDistance), true);
        }
      }

      function updateMatchMode() {
        playerTwoLabelElement.textContent = botEnabled ? "Bot" : "Player 2";
        playerTwoControlsElement.textContent = botEnabled ? "Moves automatically" : "↑ ← ↓ →";
        botToggleButton.textContent = botEnabled ? "Play 2 players" : "Play vs bot";
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        const control = controls[key];

        if (!control) {
          return;
        }

        event.preventDefault();

        if (botEnabled && control[0] === 1) {
          return;
        }

        if (!heldControls.has(key)) {
          heldControls.set(key, control);
          movePlayer(...control);
        }
      });

      document.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();

        if (heldControls.has(key)) {
          event.preventDefault();
          heldControls.delete(key);
        }
      });

      window.addEventListener("blur", () => heldControls.clear());
      window.setInterval(() => {
        heldControls.forEach((control) => movePlayer(...control));

        if (botEnabled && Date.now() - lastBotMove >= BOT_MOVE_INTERVAL) {
          lastBotMove = Date.now();
          moveBot();
        }
      }, MOVE_INTERVAL);
      window.setInterval(updateTimedEffects, EFFECT_INTERVAL);

      botToggleButton.addEventListener("click", () => {
        botEnabled = !botEnabled;
        heldControls.clear();
        updateMatchMode();
        restartGame();
      });
      restartButton.addEventListener("click", restartGame);
      restartGame();
    </script>
  </body>
</html>
