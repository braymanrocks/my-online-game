<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Evalve | My Online Game</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { background: radial-gradient(circle at top, #176b70, #07151f 72%); color: #f8fbff; margin: 0; min-height: 100vh; }
      main { margin: auto; max-width: 620px; padding: 24px 16px 42px; text-align: center; }
      a { color: #ffd44f; }
      .shell { background: #0e2531e8; border: 1px solid #ffffff38; border-radius: 20px; box-shadow: 0 18px 45px #0007; padding: 18px; }
      h1 { font-size: clamp(2.5rem, 11vw, 4.5rem); letter-spacing: -.08em; margin: 12px 0 4px; }
      .tagline { color: #c4deea; margin: 0 0 18px; }
      .hud { display: flex; justify-content: space-around; margin-bottom: 14px; }
      .hud span { color: #afd0dc; font-size: .8rem; font-weight: bold; text-transform: uppercase; }
      .hud strong { color: #fff; display: block; font-size: 1.4rem; margin-top: 3px; }
      #road { background: linear-gradient(90deg, #176052, #48515a 14%, #303941 86%, #176052); border: 3px solid #8ce2d2; border-radius: 14px; height: min(68vh, 500px); margin: auto; max-width: 370px; overflow: hidden; position: relative; }
      #road::before, #road::after { background: repeating-linear-gradient(#fff 0 34px, transparent 34px 68px); content: ""; height: 100%; opacity: .7; position: absolute; top: 0; width: 5px; }
      #road::before { left: 33.33%; } #road::after { left: 66.66%; }
      .road-line { background: repeating-linear-gradient(#fff 0 34px, transparent 34px 68px); height: 100%; left: 49.5%; opacity: .25; position: absolute; top: 0; width: 5px; }
      .car { align-items: center; display: flex; font-size: 2.4rem; height: 54px; justify-content: center; position: absolute; transform: translateX(-50%); width: 74px; z-index: 2; }
      #player { bottom: 18px; filter: drop-shadow(0 5px 3px #0008); transition: left 100ms ease-out; }
      .traffic { filter: drop-shadow(0 4px 3px #0008); top: -64px; }
      .boost { font-size: 2rem; top: -48px; }
      button { background: #ffd44f; border: 0; border-radius: 10px; color: #132633; cursor: pointer; font: inherit; font-weight: bold; padding: 11px 18px; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      #status { color: #c4deea; min-height: 1.5em; }
      .controls { color: #c4deea; font-size: .9rem; line-height: 1.5; }
      kbd { background: #09202c; border: 1px solid #82c9c4; border-radius: 4px; padding: 2px 6px; }
      .touch-controls { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
      .touch-controls button { font-size: 1.5rem; min-width: 76px; }
    </style>
  </head>
  <body>
    <main>
      <a href="index.html">← Back to games</a>
      <h1>Cool Evalve</h1>
      <p class="tagline">Dodge traffic. Grab boosts. Keep your cool.</p>
      <section class="shell" aria-label="Cool Evalve driving game">
        <button id="start" type="button">Start driving</button>
        <div class="hud">
          <div><span>Score</span><strong id="score">0</strong></div>
          <div><span>Best</span><strong id="best">0</strong></div>
          <div><span>Speed</span><strong id="speed">1x</strong></div>
        </div>
        <div id="road" aria-label="Three-lane road">
          <div class="road-line" aria-hidden="true"></div>
          <div id="player" class="car" aria-label="Your car">🏎️</div>
        </div>
        <p id="status" role="status">Press Start driving to hit the road.</p>
        <p class="controls">Use <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to change lanes.</p>
        <div class="touch-controls">
          <button id="left" type="button" aria-label="Move left">←</button>
          <button id="right" type="button" aria-label="Move right">→</button>
        </div>
      </section>
    </main>
    <script>
      const road = document.querySelector("#road");
      const player = document.querySelector("#player");
      const scoreElement = document.querySelector("#score");
      const bestElement = document.querySelector("#best");
      const speedElement = document.querySelector("#speed");
      const status = document.querySelector("#status");
      const start = document.querySelector("#start");
      const bestKey = "cool-evalve-best";
      const lanePositions = ["16.66%", "50%", "83.33%"];
      const trafficCars = ["🚕", "🚙", "🚓", "🚗"];
      let lane = 1;
      let score = 0;
      let running = false;
      let lastTime = 0;
      let spawnTime = 0;
      let gameTime = 0;
      let animation;

      bestElement.textContent = localStorage.getItem(bestKey) || "0";
      player.style.left = lanePositions[lane];

      function move(direction) {
        if (!running) return;
        lane = Math.max(0, Math.min(2, lane + direction));
        player.style.left = lanePositions[lane];
      }

      function spawnObstacle() {
        const obstacle = document.createElement("div");
        const isBoost = Math.random() < 0.13;
        obstacle.className = `car ${isBoost ? "boost" : "traffic"}`;
        obstacle.textContent = isBoost ? "⚡" : trafficCars[Math.floor(Math.random() * trafficCars.length)];
        obstacle.dataset.lane = String(Math.floor(Math.random() * 3));
        obstacle.style.left = lanePositions[Number(obstacle.dataset.lane)];
        road.append(obstacle);
      }

      function collides(obstacle) {
        const obstacleRect = obstacle.getBoundingClientRect();
        const playerRect = player.getBoundingClientRect();
        return obstacleRect.bottom > playerRect.top + 10
          && obstacleRect.top < playerRect.bottom - 8
          && obstacleRect.left < playerRect.right - 8
          && obstacleRect.right > playerRect.left + 8;
      }

      function endGame() {
        running = false;
        cancelAnimationFrame(animation);
        document.querySelectorAll(".traffic, .boost").forEach(obstacle => obstacle.remove());
        const best = Math.max(score, Number(localStorage.getItem(bestKey) || 0));
        localStorage.setItem(bestKey, String(best));
        bestElement.textContent = String(best);
        start.textContent = "Drive again";
        status.textContent = `Crash! Your score was ${score}.`;
      }

      function frame(time) {
        if (!running) return;
        const delta = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;
        gameTime += delta;
        const pace = 150 + score * 3 + gameTime * 12;
        spawnTime += delta;
        if (spawnTime > Math.max(.34, .95 - score / 180)) {
          spawnObstacle();
          spawnTime = 0;
        }
        document.querySelectorAll(".traffic, .boost").forEach(obstacle => {
          obstacle.style.top = `${obstacle.offsetTop + pace * delta}px`;
          if (collides(obstacle)) {
            if (obstacle.classList.contains("boost")) {
              score += 5;
              obstacle.remove();
              status.textContent = "Boost collected!";
            } else {
              endGame();
            }
          } else if (obstacle.offsetTop > road.clientHeight) {
            obstacle.remove();
            score += 1;
          }
        });
        scoreElement.textContent = String(score);
        speedElement.textContent = `${(1 + score / 45).toFixed(1)}x`;
        animation = requestAnimationFrame(frame);
      }

      function startGame() {
        document.querySelectorAll(".traffic, .boost").forEach(obstacle => obstacle.remove());
        lane = 1;
        score = 0;
        running = true;
        spawnTime = 0;
        gameTime = 0;
        player.style.left = lanePositions[lane];
        scoreElement.textContent = "0";
        speedElement.textContent = "1x";
        start.textContent = "Restart";
        status.textContent = "Traffic ahead! Stay in control.";
        lastTime = performance.now();
        animation = requestAnimationFrame(frame);
      }

      start.addEventListener("click", startGame);
      document.addEventListener("keydown", event => {
        if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
          event.preventDefault();
          move(-1);
        } else if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
          event.preventDefault();
          move(1);
        }
      });
      document.querySelector("#left").addEventListener("click", () => move(-1));
      document.querySelector("#right").addEventListener("click", () => move(1));
    </script>
  </body>
</html>
