<body>
  <main>
    <div class="topline"><a href="my-online-games.html" style="color:#d4e4ff">← All games</a><div class="actions"><label id="bot-difficulty-label" class="hidden">Bot difficulty <select id="bot-difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><button id="mode-toggle" type="button">Play vs bot</button><button id="restart" type="button">New game</button></div></div>

  </main>
  <script>
    (() => {
      const ITEMS = [
        {id:'green', name:'Green', color:'#53b75b', text:'+2 attack on Land'},
        {id:'brown', name:'Brown', color:'#95613a', text:'+6 life on Land'},

        {id:'lightblue', name:'Light blue', color:'#67cdeb', text:'+6 life on Ocean'},
        {id:'black', name:'Black', color:'#20232b', text:'+1 attack anywhere; each pair: +1 vote'},
        {id:'pink', name:'Pink', color:'#ed7caf', text:'+1 vote; each pair: +1 attack'},
        {id:'yellow', name:'Yellow', color:'#f2c43e', text:'Every 4: +4 votes; each pair: +1 heart'},
        {id:'red', name:'Red', color:'#dc4c4c', text:'+3 life; every 3: +1 heart'},
        {id:'gray', name:'Gray gear', color:'#8b96a7', text:'Cannon part: use 2 gray gears with Gold Ammo and Red'},
        {id:'gold', name:'Gold Ammo', color:'#d9ad36', text:'Cannon ammo: 2 Gold Ammo, Red, and gray gears make a cannon'}
      ];
      const item = id => ITEMS.find(x => x.id === id);
      const BOT_DRAFTS = {
        easy:['black','black','red','red','red','pink','pink','yellow','yellow','green','brown','blue','lightblue','red','black','red','yellow','pink','green','blue'],
        medium:['black','black','black','black','black','red','red','red','red','pink','pink','pink','yellow','yellow','green','brown','blue','lightblue','red','black'],
        hard:['black','black','black','black','black','black','black','red','red','red','red','red','pink','pink','pink','pink','yellow','yellow','red','black']
      };
      const blank = () => ({ ...Object.fromEntries(ITEMS.map(x => [x.id, 0])), history:[] });
      const CANNONBALL_TRAVEL_MS = 450;
      const state = { phase:'buying', picks:[blank(),blank()], buyTurn:0, terrain:null, buildPlayer:0, monsters:[[],[]], robots:[[],[]], meleeRobots:[[],[]], selected:0, selectedRobot:0, selectedMeleeRobot:0, buildTarget:'monster', battle:null, botEnabled:false, botDifficulty:'medium' };
      const game = document.querySelector('#game');
      const botDifficultyElement = document.querySelector('#bot-difficulty');
      const botDifficultyLabel = document.querySelector('#bot-difficulty-label');
      const modeToggleButton = document.querySelector('#mode-toggle');
      const count = (bag, id) => bag[id] || 0;
      const total = bag => ITEMS.reduce((n,x) => n + count(bag,x.id), 0);
      function canSelectItem(bag, id) { if(total(bag)>=20) return false; if(total(bag)<19) return true; return valid({...bag,[id]:count(bag,id)+1}); }
      const robotReady = bag => count(bag,'gold') >= 2 && count(bag,'gray') >= 2 && count(bag,'red') >= 1;
      const meleeRobotReady = bag => count(bag,'gray') >= 2 && count(bag,'black') >= 1 && count(bag,'red') >= 1;
      const votes = bag => count(bag,'pink') + Math.floor(count(bag,'black') / 2) + Math.floor(count(bag,'yellow') / 4) * 4;
      const terrainName = () => state.terrain === 'both' ? 'Both — Land and Ocean' : state.terrain;
      const botDraft = () => BOT_DRAFTS[state.botDifficulty];
      const botSettings = () => ({easy:{delay:850,defend:.06,attack:.68},medium:{delay:550,defend:.18,attack:.9},hard:{delay:350,defend:.3,attack:1}})[state.botDifficulty];
      function stats(bag) {
        const land = state.terrain === 'land' || state.terrain === 'both';
        const ocean = state.terrain === 'ocean' || state.terrain === 'both';
        return {
          attack: count(bag,'black') + Math.floor(count(bag,'pink') / 2) + (land ? count(bag,'green') * 2 : 0) + (ocean ? count(bag,'blue') * 2 : 0),
          life: count(bag,'red') * 3 + (land ? count(bag,'brown') * 6 : 0) + (ocean ? count(bag,'lightblue') * 6 : 0),
          hearts: Math.floor(count(bag,'yellow') / 2) + Math.floor(count(bag,'red') / 3)
        };
      }
      function firstStatItem(bag, stat) {
        const replay = blank();
        for (const id of bag.history) {
          const before = stats(replay)[stat];
          replay[id] += 1;

        }
        return null;
      }
      function firstStatColor(bag, stat) { return firstStatItem(bag, stat)?.color || '#465873'; }
      function firstVoteHorns(bag) {
        const replay = blank();
        for (const id of bag.history) {
          const before = votes(replay);
          replay[id] += 1;
          if (votes(replay) > before) return { color:item(id).color, count:count(replay, id) };
        }
        return null;
      }
      function monsterMarkup(bag, p, label='Monster', winner=false, pose='') {
        const headItem = item(bag.history.at(-1));

        const hornsMarkup = hornConfig ? `<span class="monster-horns" style="--horn:${hornConfig.color};--horn-count:${hornConfig.count}" aria-hidden="true">${'<span class="monster-horn"></span>'.repeat(hornConfig.count)}</span>` : '';
        return `<span class="monster ${winner?'winner-glow':''} ${pose}" role="img" aria-label="${label}" style="--head:${head};--arms:${arms};--legs:${legs};--stomach:${stomach};--eyes:${p ? '#b783ff' : '#ff9b3d'}"><span class="monster-tail ${legShape === 'shark-tail' ? 'shark-tail' : ''}" aria-hidden="true"></span>${legsMarkup}${armsMarkup}<span class="monster-part monster-stomach" aria-hidden="true"></span>${hornsMarkup}<span class="monster-part monster-head ${headShape}" aria-hidden="true"></span></span>`;
      }
      function robotMarkup(p, attacking=false) { return `<span class="robot cannon robot-p${p+1} ${attacking?'robot-punch':''}" role="img" aria-label="Player ${p+1} cannon"><span class="cannon-base" aria-hidden="true"></span><span class="cannon-wheel left" aria-hidden="true"></span><span class="cannon-wheel right" aria-hidden="true"></span><span class="cannon-barrel" aria-hidden="true"></span><span class="cannon-muzzle" aria-hidden="true"></span></span>`; }
      function meleeRobotMarkup(p, attacking=false) { return `<span class="robot robot-p${p+1} ${attacking?'robot-punch':''}" role="img" aria-label="Player ${p+1} melee robot" style="--robot-eyes:${p ? '#b783ff' : '#ff9b3d'}"><span class="robot-antenna" aria-hidden="true"></span><span class="robot-head" aria-hidden="true"><i></i><i></i></span><span class="robot-body" aria-hidden="true"></span></span>`; }
      function updateTrack() { document.querySelectorAll('.phase').forEach(e => e.classList.toggle('active', e.dataset.phase === state.phase)); }
      function playerSummary(p, reveal=true) { if (!reveal) return `<div class="player-box p${p+1}"><h3>Player ${p+1}</h3><p class="subtle">Selections are hidden while the other player is choosing.</p></div>`; const bag=state.picks[p], summary=stats(bag); return `<div class="player-box p${p+1}"><h3>Player ${p+1}</h3><div class="counter">${total(bag)} / 20 items</div><div class="stats"><div class="stat"><b>${summary.life}</b>life</div><div class="stat"><b>${summary.attack}</b>attack</div><div class="stat"><b>${summary.hearts}</b>hearts</div></div></div>`; }
      function renderBuying() {
        const p=state.buyTurn, bag=state.picks[p], canPick=total(bag) < 20, draftReady=total(bag)===20&&valid(bag);
        const botTurn=state.botEnabled&&p===1;
        game.innerHTML = `<h2>Buying</h2><div class="notice"><strong>${botTurn?`Bot is drafting its ${state.botDifficulty} picks.`:`Player ${p+1}'s picks.`}</strong> Choose exactly 20 items, then confirm the draft. Your final item is available only when the completed draft has at least <b>1 heart, 1 life, and 1 attack</b>. Use + and − to change selected items before continuing. The other player's selections stay hidden until buying ends.</div><div class="players">${playerSummary(0,p===0)}${playerSummary(1,p===1)}</div><h3>Choose unlimited item cards</h3><div class="card-grid">${ITEMS.map(x => `<article class="item-card" style="--card:${x.color}"><strong><span class="swatch" style="--card:${x.color}"></span>${x.name}</strong><small>${x.text}<br><b>${count(bag,x.id)}</b> selected</small><span class="alloc-controls"><button aria-label="Remove ${x.name}" data-unbuy="${x.id}" ${count(bag,x.id)&&!botTurn?'':'disabled'}>−</button><button aria-label="Add ${x.name}" data-buy="${x.id}" ${canPick&&canSelectItem(bag,x.id)&&!botTurn?'':'disabled'}>+</button></span></article>`).join('')}</div>${botTurn?'':`<div class="actions"><button class="primary" id="finish-buy" ${draftReady?'':'disabled'}>Confirm Player ${p+1}'s 20 items</button></div>`}`;
        game.querySelectorAll('[data-buy]').forEach(b => b.onclick=() => buy(b.dataset.buy));
        game.querySelectorAll('[data-unbuy]').forEach(b => b.onclick=() => unbuy(b.dataset.unbuy));
        const finishButton=game.querySelector('#finish-buy'); if(finishButton) finishButton.onclick=finishBuying;
      }
      function buy(id) {
        const p=state.buyTurn; if (!canSelectItem(state.picks[p],id)) return;
        state.picks[p][id]++;
        render();
      }
      function unbuy(id) { const bag=state.picks[state.buyTurn]; if(!bag[id]) return; bag[id]--; render(); }
      function finishBuying() { const p=state.buyTurn; if(total(state.picks[p])!==20||!valid(state.picks[p])) return; if(p===0){state.buyTurn=1;render();if(state.botEnabled) window.setTimeout(draftBotItems,550);return;} state.phase='choosing';render(); }
      function draftBotItems() {
        if (!state.botEnabled || state.phase!=='buying' || state.buyTurn!==1) return;
        botDraft().forEach(id=>state.picks[1][id]++);
        state.phase='choosing';
        render();
      }
      function renderChoosing() {
        const a=votes(state.picks[0]), b=votes(state.picks[1]);
        if (a === b) { state.terrain='both'; game.innerHTML=`<h2>Choosing</h2><div class="notice"><strong>It is a ${a}–${b} tie.</strong> Both terrain bonuses apply to every monster: Land and Ocean.</div><div class="players">${playerSummary(0)}${playerSummary(1)}</div><div class="actions"><button class="primary" id="continue">Continue to Building</button></div>`; document.querySelector('#continue').onclick=() => { state.phase='building'; render(); }; return; }
        const winner=a>b?0:1;
        if (state.botEnabled && winner===1) {
          game.innerHTML=`<h2>Choosing</h2><div class="notice"><strong>Bot won the vote (${b} to ${a}).</strong> It is choosing the terrain.</div><div class="players">${playerSummary(0)}${playerSummary(1)}</div>`;
          window.setTimeout(()=>{if(state.phase==='choosing'){const bot=state.picks[1],land=count(bot,'green')*2+count(bot,'brown')*6,ocean=count(bot,'blue')*2+count(bot,'lightblue')*6;state.terrain=land>=ocean?'land':'ocean';state.phase='building';render();}},650);
          return;
        }
        game.innerHTML=`<h2>Choosing</h2><div class="notice"><strong>Player ${winner+1} won the vote (${Math.max(a,b)} to ${Math.min(a,b)}).</strong> Choose the terrain. It affects every monster's item bonuses.</div><div class="players">${playerSummary(0)}${playerSummary(1)}</div><div class="choice"><button class="land" data-terrain="land">Choose Land<br><small>Green attack + Brown life</small></button><button class="ocean" data-terrain="ocean">Choose Ocean<br><small>Dark blue attack + Light blue life</small></button></div>`;
        game.querySelectorAll('[data-terrain]').forEach(b => b.onclick=() => { state.terrain=b.dataset.terrain; state.phase='building'; render(); });
      }
      function allocated(p) { const out=blank(); [...state.monsters[p],...state.robots[p],...state.meleeRobots[p]].forEach(unit => ITEMS.forEach(x => out[x.id]+=count(unit,x.id))); return out; }
      function valid(bag) { const s=stats(bag); return s.hearts>=1 && s.attack>=1 && s.life>=1; }
      function renderBuilding() {
        const p=state.buildPlayer, roster=state.monsters[p], cannonRoster=state.robots[p], meleeRobotRoster=state.meleeRobots[p], isCannon=state.buildTarget==='cannon', isMeleeRobot=state.buildTarget==='melee-robot', selected=isCannon?cannonRoster[state.selectedRobot]:isMeleeRobot?meleeRobotRoster[state.selectedMeleeRobot]:roster[state.selected], used=allocated(p), remaining=Object.fromEntries(ITEMS.map(x=>[x.id,count(state.picks[p],x.id)-count(used,x.id)])), ready=isCannon?robotReady(selected):isMeleeRobot?meleeRobotReady(selected):valid(selected);
        const unitName=isCannon?`Cannon ${state.selectedRobot+1}`:isMeleeRobot?`Robot ${state.selectedMeleeRobot+1}`:`Monster ${state.selected+1}`, selectedPreview=isCannon?`<span class="robot-preview">${robotMarkup(p)}</span>`:isMeleeRobot?`<span class="robot-preview">${meleeRobotMarkup(p)}</span>`:monsterMarkup(selected,p,'Selected monster'), selectedDetails=isCannon?`<div><h3>${unitName} ${ready?'— Ready':'— Needs parts'}</h3><div class="stats"><div class="stat"><b>${count(selected,'gold')} / 2</b>Gold Ammo</div><div class="stat"><b>${count(selected,'gray')} / 2</b>gray gears</div><div class="stat"><b>${count(selected,'red')} / 1</b>red</div></div><span class="subtle">A ready cannon has 25 life and fires a dodgeable cannonball at the opposing monster for 5 damage every 5 seconds. Up to three cannons can enter battle in order.</span></div>`:isMeleeRobot?`<div><h3>${unitName} ${ready?'— Ready':'— Needs parts'}</h3><div class="stats"><div class="stat"><b>${count(selected,'gray')} / 2</b>gray gears</div><div class="stat"><b>${count(selected,'black')} / 1</b>black</div><div class="stat"><b>${count(selected,'red')} / 1</b>red</div></div><span class="subtle">A ready robot has 20 life, moves toward the opposing monster, and deals 1 damage when adjacent. Up to three robots can enter battle in order.</span></div>`:`<div><h3>${unitName} ${ready?'— Ready':'— Not battle-ready'}</h3>${statMarkup(stats(selected))}<span class="subtle">Arms use the first item that adds attack: green gives claws, blue gives fins, and black keeps normal arms. The first life item colors the legs: light blue gives a shark tail, brown gives claws, and red keeps the original legs. The stomach uses the first heart item; the head uses the last item added—land colors make a tiger head and ocean colors make a shark head. The first voting item adds matching horns: one pink, two black, or four yellow.</span></div>`;

        game.innerHTML=`<h2>Building — Player ${p+1}</h2><div class="notice"><strong>Terrain: ${terrainName()}.</strong> Allocate drafted items among up to five monsters, three cannons, and three robots. Monsters need <b>1 heart, 1 attack, and 1 life</b>. Each cannon needs <b>2 Gold Ammo, 2 gray gears, and 1 red</b>. Each robot needs <b>2 gray gears, 1 black, and 1 red</b>.</div>
          <div class="build-layout"><section><h3>Your battle units</h3><div class="monster-tabs">${roster.map((m,i)=>`<button class="monster-tab ${!isCannon&&!isMeleeRobot&&i===state.selected?'selected':''} ${valid(m)?'':'invalid'}" data-select-monster="${i}">${monsterMarkup(m,p,`Monster ${i+1}`)}<br>Monster ${i+1}<br><small>${valid(m)?'ready':'invalid'}</small></button>`).join('')}${cannonRoster.map((cannon,i)=>`<button class="monster-tab ${isCannon&&i===state.selectedRobot?'selected':''} ${robotReady(cannon)?'':'invalid'}" data-select-cannon="${i}"><span class="robot-preview">${robotMarkup(p)}</span><br>Cannon ${i+1}<br><small>${robotReady(cannon)?'ready':'needs parts'}</small></button>`).join('')}${meleeRobotRoster.map((robot,i)=>`<button class="monster-tab ${isMeleeRobot&&i===state.selectedMeleeRobot?'selected':''} ${meleeRobotReady(robot)?'':'invalid'}" data-select-melee-robot="${i}"><span class="robot-preview">${meleeRobotMarkup(p)}</span><br>Robot ${i+1}<br><small>${meleeRobotReady(robot)?'ready':'needs parts'}</small></button>`).join('')}</div>

        game.querySelectorAll('[data-select-monster]').forEach(b=>b.onclick=()=>{state.buildTarget='monster';state.selected=+b.dataset.selectMonster;render();});
        game.querySelectorAll('[data-select-cannon]').forEach(b=>b.onclick=()=>{state.buildTarget='cannon';state.selectedRobot=+b.dataset.selectCannon;render();});
        game.querySelectorAll('[data-select-melee-robot]').forEach(b=>b.onclick=()=>{state.buildTarget='melee-robot';state.selectedMeleeRobot=+b.dataset.selectMeleeRobot;render();});
        game.querySelector('#add-monster').onclick=()=>{ if(roster.length<5){roster.push(blank());state.buildTarget='monster';state.selected=roster.length-1;render();} };
        game.querySelector('#add-cannon').onclick=()=>{ if(cannonRoster.length<3){cannonRoster.push(blank());state.buildTarget='cannon';state.selectedRobot=cannonRoster.length-1;render();} };

        game.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const id=b.dataset.add;if(remaining[id]&&(!allowedParts||allowedParts.includes(id))){selected[id]++;selected.history.push(id);render();}});
        game.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const id=b.dataset.remove;if(selected[id]){selected[id]--;selected.history.splice(selected.history.lastIndexOf(id),1);render();}});
        game.querySelector('#finish-build').onclick=finishBuilding;
      }
      function statMarkup(s) { return `<div class="stats"><div class="stat"><b>${s.hearts}</b>hearts</div><div class="stat"><b>${s.attack}</b>attack</div><div class="stat"><b>${s.life}</b>life</div></div>`; }

      }
      function finishBuilding() { if(!state.monsters[state.buildPlayer].some(valid)) return; if(state.buildPlayer===0){if(state.botEnabled){buildBotRoster();startBattle();return;}state.buildPlayer=1;state.selected=0;state.selectedRobot=0;state.selectedMeleeRobot=0;state.buildTarget='monster';state.monsters[1]=[blank()];state.robots[1]=[];state.meleeRobots[1]=[];render();} else startBattle(); }
      function startBattle() {
        const rosters=state.monsters.map(r=>r.filter(valid).map(bag=>{const monsterStats=stats(bag);return {...monsterStats,maxLife:monsterStats.life,bag};}));
        const robotRosters=state.robots.map((robots,p)=>robots.filter(robotReady).map(bag=>({owner:p,life:25,maxLife:25,position:p?{r:8,c:7}:{r:0,c:1},attacking:0,nextShot:Date.now()+5000})));
        const meleeRobotRosters=state.meleeRobots.map((robots,p)=>robots.filter(meleeRobotReady).map(bag=>({owner:p,life:20,maxLife:20,position:p?{r:8,c:6}:{r:0,c:2},attacking:0})));
        state.phase='battle'; state.battle={rosters, indices:[0,0], positions:[{r:0,c:0},{r:8,c:8}], robotRosters, robotIndices:[0,0], meleeRobotRosters, meleeRobotIndices:[0,0], attackCooldown:[0,0], defendCooldown:[0,0], defending:[0,0], animation:null, projectiles:[], winner:null};
        render(); state.battle.timer=setInterval(renderBattle, 125); state.battle.robotTimer=setInterval(runRobots, 125); state.battle.meleeRobotTimer=setInterval(runMeleeRobots, 600); if(state.botEnabled)state.battle.botTimer=setInterval(runBotTurn, botSettings().delay);
      }
      function active(p) { const b=state.battle; return b.rosters[p][b.indices[p]]; }
      function activeRobot(p) { const b=state.battle; return b.robotRosters[p][b.robotIndices[p]]; }
      function activeMeleeRobot(p) { const b=state.battle; return b.meleeRobotRosters[p][b.meleeRobotIndices[p]]; }
      function timeLeft(stamp) { return Math.max(0, (stamp-Date.now())/1000); }
      function samePosition(a,b) { return a.r===b.r&&a.c===b.c; }
      function robotAt(b, position) { return [0,1].findIndex(p=>{const robot=activeRobot(p);return robot&&robot.life>0&&samePosition(robot.position,position);}); }
      function meleeRobotAt(b, position) { return [0,1].findIndex(p=>{const robot=activeMeleeRobot(p);return robot&&robot.life>0&&samePosition(robot.position,position);}); }
      function battlePose(p) { const b=state.battle, animation=b.animation&&b.animation.until>Date.now()?b.animation:null; return `${timeLeft(b.defending[p])?'blocking':''} ${animation?.attacker===p?`punch-p${p+1}`:''} ${animation?.blocked&&animation.defender===p?'blocked':''}`; }
      function renderBattle() {
        if(state.phase!=='battle') return; const b=state.battle, occupied=(r,c)=>b.positions.findIndex(pos=>pos.r===r&&pos.c===c);
        const cells=Array.from({length:81},(_,i)=>{const position={r:Math.floor(i/9),c:i%9},p=occupied(position.r,position.c),cannon=robotAt(b,position),meleeRobot=meleeRobotAt(b,position), defeated=b.winner!==null&&p!==b.winner; if(p>=0&&!defeated)return `<div class="cell">${monsterMarkup(active(p).bag,p,`Player ${p+1} monster`,p===b.winner,battlePose(p))}</div>`; if(cannon>=0&&b.winner===null){const active=activeRobot(cannon);return `<div class="cell">${robotMarkup(cannon,Date.now()<active.attacking)}</div>`;} if(meleeRobot>=0&&b.winner===null){const active=activeMeleeRobot(meleeRobot);return `<div class="cell">${meleeRobotMarkup(meleeRobot,Date.now()<active.attacking)}</div>`;} return '<div class="cell"></div>';}).join('');
        const cannonballs=b.projectiles.filter(projectile=>projectile.until>Date.now()).map(projectile=>`<span class="cannonball" aria-hidden="true" style="--shot-from-x:${(projectile.from.c+.5)/9*100}%;--shot-from-y:${(projectile.from.r+.5)/9*100}%;--shot-to-x:${(projectile.to.c+.5)/9*100}%;--shot-to-y:${(projectile.to.r+.5)/9*100}%;animation-delay:${-(Date.now()-projectile.started)/1000}s"></span>`).join('');
        const playerInfo=p=>{const won=b.winner===p, defeated=b.winner!==null&&!won;if(defeated)return `<div class="player-box p${p+1}"><h3>Player ${p+1}</h3><p class="subtle">All monsters defeated.</p></div>`;const m=active(p), cannon=activeRobot(p), meleeRobot=activeMeleeRobot(p), attackCd=timeLeft(b.attackCooldown[p]), defendCd=timeLeft(b.defendCooldown[p]), defending=timeLeft(b.defending[p]); return `<div class="player-box p${p+1} ${won?'winner-glow':''}"><h3>${state.botEnabled&&p===1?'Bot':`Player ${p+1}`}${won?' — Winner!':''} — Monster ${b.indices[p]+1}/${b.rosters[p].length}</h3>${statMarkup(m)}<div><b>Current life:</b> ${m.life} / ${m.maxLife} · <b>Attack:</b> ${attackCd?`${attackCd.toFixed(1)}s cooldown`:'ready'} · <b>Defend:</b> ${defending?`ACTIVE ${defending.toFixed(1)}s`:defendCd?`${defendCd.toFixed(1)}s cooldown`:'ready'}</div>${cannon?`<div><b>Cannon ${b.robotIndices[p]+1}/${b.robotRosters[p].length}:</b> ${cannon.life} / ${cannon.maxLife} · fires 5 damage in ${timeLeft(cannon.nextShot).toFixed(1)}s</div>`:''}${meleeRobot?`<div><b>Robot ${b.meleeRobotIndices[p]+1}/${b.meleeRobotRosters[p].length}:</b> ${meleeRobot.life} / ${meleeRobot.maxLife} · auto melee attack</div>`:''}<p class="subtle">${p===0?'<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Left Shift</kbd> attack · <kbd>1</kbd> defend':state.botEnabled?'Bot moves, attacks, and defends automatically.':'Arrow keys move · <kbd>Right Shift</kbd> attack · <kbd>0</kbd> defend'}</p></div>`;};
        const sideLife=p=>{const defeated=b.winner!==null&&b.winner!==p;return `<div class="side-life p${p+1}"><strong>Player ${p+1}</strong><span class="subtle">Current life</span><b>${defeated?'0':`${active(p).life} / ${active(p).maxLife}`}</b></div>`;};
        const controls=p=>{const attackReady=!timeLeft(b.attackCooldown[p]), defendReady=!timeLeft(b.defendCooldown[p]);return `<div class="actions"><button class="primary" data-attack="${p}" ${attackReady?'':'disabled'}>Punch attack</button><button data-defend="${p}" ${defendReady?'':'disabled'}>Block attack</button></div>`;};
        game.innerHTML=`<h2>Battle — ${terrainName()} Arena</h2><div class="notice">Move on the 9×9 grid. Attack an adjacent enemy (Manhattan distance 1) to make your monster punch. Defend raises a block for one second and stops incoming attacks. Attack and defend each recharge in 5 seconds.${b.robotRosters.some(robots=>robots.length)?' Cannons fire a visible cannonball at the opposing monster every 5 seconds. Move away before it reaches your monster to dodge 5 damage. When one is destroyed, the next ready cannon enters.':''}${b.meleeRobotRosters.some(robots=>robots.length)?' Robots move toward the opposing monster and deal 1 damage when adjacent.':''}</div><div class="battle-info">${playerInfo(0)}${playerInfo(1)}</div><div class="arena-wrap"><div class="battle-board">${sideLife(0)}<div class="arena ${state.terrain}" role="img" aria-label="Nine by nine ${terrainName()} monster battle grid">${cells}${cannonballs}</div>${sideLife(1)}</div></div>${b.winner!==null?`<div class="winner">Player ${b.winner+1} wins — all opposing monsters were destroyed!</div>`:`<div class="battle-controls">${controls(0)}${state.botEnabled?'':controls(1)}</div>`}`;
        game.querySelectorAll('[data-attack]').forEach(button=>button.onclick=()=>attack(+button.dataset.attack));
        game.querySelectorAll('[data-defend]').forEach(button=>button.onclick=()=>defend(+button.dataset.defend));
      }
      function move(p, dr, dc) { const b=state.battle;if(!b||b.winner!==null)return;const old=b.positions[p], next={r:old.r+dr,c:old.c+dc}, foe=b.positions[1-p];if(next.r<0||next.r>8||next.c<0||next.c>8||samePosition(next,foe)||robotAt(b,next)>=0||meleeRobotAt(b,next)>=0)return;b.positions[p]=next;renderBattle(); }
      function attack(p) { const b=state.battle;if(!b||b.winner!==null||timeLeft(b.attackCooldown[p]))return; b.attackCooldown[p]=Date.now()+5000; const foe=1-p, a=b.positions[p], cannon=activeRobot(foe), meleeRobot=activeMeleeRobot(foe), cannonTarget=cannon&&cannon.life>0&&Math.abs(a.r-cannon.position.r)+Math.abs(a.c-cannon.position.c)<=1?cannon:null, meleeRobotTarget=meleeRobot&&meleeRobot.life>0&&Math.abs(a.r-meleeRobot.position.r)+Math.abs(a.c-meleeRobot.position.c)<=1?meleeRobot:null, target=cannonTarget||meleeRobotTarget, monsterAdjacent=Math.abs(a.r-b.positions[foe].r)+Math.abs(a.c-b.positions[foe].c)<=1, blocked=!target&&monsterAdjacent&&!!timeLeft(b.defending[foe]); b.animation={attacker:p,defender:foe,blocked,until:Date.now()+650}; if(target) { target.life=Math.max(0,target.life-active(p).attack);if(target.life===0){if(cannonTarget)defeatRobot(foe);else defeatMeleeRobot(foe);}} else if(monsterAdjacent&&!blocked) { active(foe).life-=active(p).attack; if(active(foe).life<=0) defeat(foe); } renderBattle(); }
      function defend(p) { const b=state.battle;if(!b||b.winner!==null||timeLeft(b.defendCooldown[p]))return;b.defendCooldown[p]=Date.now()+5000;b.defending[p]=Date.now()+1000;renderBattle(); }
      function defeatRobot(p) { const b=state.battle;b.robotIndices[p]++;const robot=activeRobot(p);if(robot)robot.position=p?{r:8,c:7}:{r:0,c:1}; }
      function defeatMeleeRobot(p) { const b=state.battle;b.meleeRobotIndices[p]++;const robot=activeMeleeRobot(p);if(robot)robot.position=p?{r:8,c:6}:{r:0,c:2}; }
      function runRobots() { const b=state.battle;if(!b||b.winner!==null)return;const now=Date.now();const arriving=b.projectiles.filter(projectile=>projectile.until<=now);b.projectiles=b.projectiles.filter(projectile=>projectile.until>now);arriving.forEach(projectile=>{if(b.winner!==null||!samePosition(b.positions[projectile.target],projectile.to))return;const target=active(projectile.target);target.life-=5;if(target.life<=0)defeat(projectile.target);});[0,1].forEach(owner=>{const robot=activeRobot(owner);if(b.winner!==null||!robot||robot.life<=0||now<robot.nextShot)return;robot.nextShot=now+5000;robot.attacking=now+CANNONBALL_TRAVEL_MS;const foe=1-owner;b.projectiles.push({from:{...robot.position},to:{...b.positions[foe]},target:foe,started:now,until:now+CANNONBALL_TRAVEL_MS});});renderBattle(); }
      function runMeleeRobots() { const b=state.battle;if(!b||b.winner!==null)return;[0,1].forEach(owner=>{const robot=activeMeleeRobot(owner);if(b.winner!==null||!robot||robot.life<=0)return;const foe=1-owner,target=b.positions[foe],distance=Math.abs(robot.position.r-target.r)+Math.abs(robot.position.c-target.c);if(distance===1){robot.attacking=Date.now()+350;if(!timeLeft(b.defending[foe])){active(foe).life-=1;if(active(foe).life<=0)defeat(foe);}return;}const dr=target.r-robot.position.r,dc=target.c-robot.position.c,step=Math.abs(dr)>=Math.abs(dc)?{r:Math.sign(dr),c:0}:{r:0,c:Math.sign(dc)},next={r:robot.position.r+step.r,c:robot.position.c+step.c};if(next.r>=0&&next.r<=8&&next.c>=0&&next.c<=8&&!samePosition(next,b.positions[0])&&!samePosition(next,b.positions[1])&&robotAt(b,next)<0&&meleeRobotAt(b,next)<0)robot.position=next;});renderBattle(); }
      function runBotTurn() { const b=state.battle;if(!state.botEnabled||!b||b.winner!==null)return;const settings=botSettings(),bot=b.positions[1],player=b.positions[0],distance=Math.abs(bot.r-player.r)+Math.abs(bot.c-player.c);if(distance===1){if(Math.random()<settings.defend&&!timeLeft(b.defendCooldown[1]))defend(1);else if(Math.random()<settings.attack)attack(1);return;}if(Math.abs(bot.r-player.r)>=Math.abs(bot.c-player.c))move(1,player.r>bot.r?1:-1,0);else move(1,0,player.c>bot.c?1:-1); }
      function defeat(p) { const b=state.battle;b.indices[p]++; if(b.indices[p]>=b.rosters[p].length){b.winner=1-p;clearInterval(b.timer);clearInterval(b.botTimer);clearInterval(b.robotTimer);clearInterval(b.meleeRobotTimer);return;} b.positions[p]=p?{r:8,c:8}:{r:0,c:0}; }
      window.addEventListener('keydown', e => { if(state.phase!=='battle'||state.battle.winner!==null)return; const key=e.key, code=e.code, moveKey=e.key.length===1?e.key.toLowerCase():e.key; const movement={w:[0,-1,0],a:[0,0,-1],s:[0,1,0],d:[0,0,1],ArrowUp:[1,-1,0],ArrowDown:[1,1,0],ArrowLeft:[1,0,-1],ArrowRight:[1,0,1]}; if(movement[moveKey]){e.preventDefault();const [p,r,c]=movement[moveKey];if(!state.botEnabled||p===0)move(p,r,c);return;} if(code==='ShiftLeft'){e.preventDefault();if(!e.repeat)attack(0);} if(code==='ShiftRight'&&!state.botEnabled){e.preventDefault();if(!e.repeat)attack(1);} if(key==='1'){e.preventDefault();if(!e.repeat)defend(0);} if(key==='0'&&!state.botEnabled){e.preventDefault();if(!e.repeat)defend(1);} });
      function render() { updateTrack(); if(state.phase==='buying')renderBuying(); else if(state.phase==='choosing')renderChoosing(); else if(state.phase==='building')renderBuilding(); else renderBattle(); }
      function newGame() { if(state.battle?.timer)clearInterval(state.battle.timer);if(state.battle?.botTimer)clearInterval(state.battle.botTimer);if(state.battle?.robotTimer)clearInterval(state.battle.robotTimer);if(state.battle?.meleeRobotTimer)clearInterval(state.battle.meleeRobotTimer);Object.assign(state,{phase:'buying',picks:[blank(),blank()],buyTurn:0,terrain:null,buildPlayer:0,monsters:[[blank()],[]],robots:[[],[]],meleeRobots:[[],[]],selected:0,selectedRobot:0,selectedMeleeRobot:0,buildTarget:'monster',battle:null});render(); }
      botDifficultyElement.onchange=()=>{state.botDifficulty=botDifficultyElement.value;if(state.botEnabled)newGame();};
      modeToggleButton.onclick=()=>{state.botEnabled=!state.botEnabled;botDifficultyLabel.classList.toggle('hidden',!state.botEnabled);modeToggleButton.textContent=state.botEnabled?'Play 2 players':'Play vs bot';newGame();};
      document.querySelector('#restart').onclick=newGame;
      state.monsters[0]=[blank()]; render();
    })();
