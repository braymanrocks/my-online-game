<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake | My Online Game</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; } * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #25437a, #10172b 65%); color: #f8fbff; }
    main { width: min(94vw, 620px); margin: auto; padding: 28px 0 40px; text-align: center; }
    a { color: #ffcf3f; } h1 { margin: 18px 0 8px; } .panel { background: rgba(20,31,58,.88); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; padding: 18px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 14px 0; }
    fieldset { border: 0; margin: 0; padding: 0; } legend { font-weight: bold; } label { cursor: pointer; }
    button { background: #ffcf3f; border: 0; border-radius: 8px; color: #17203b; cursor: pointer; font: inherit; font-weight: bold; padding: 10px 15px; }
    button:hover, button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    canvas { background: #0b1428; border: 3px solid #4672b8; border-radius: 8px; display: block; margin: 16px auto; max-width: 100%; touch-action: none; }
    #status { min-height: 1.5em; color: #c8d5f0; } .keys { color: #c8d5f0; font-size: .95rem; } .scores { display: flex; justify-content: center; gap: 14px; margin: 12px 0; } .score-card { border: 2px solid #ffcf3f; border-radius: 10px; padding: 8px 18px; } .score-card.player-two { border-color: #b783ff; } .score-card strong { color: #ffcf3f; display: block; font-size: 1.35rem; } .score-card.player-two strong { color: #d5b7ff; } .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← Back to games</a>
    <h1>Snake</h1>
    <p>Eat fruit, grow longer, and do not hit a wall. In two-player mode, the first player to 10 points wins.</p>
    <section class="panel" aria-label="Snake game">
      <div class="controls">
        <fieldset><legend>Difficulty</legend>
          <label><input type="radio" name="difficulty" value="easy" checked> Easy</label>
          <label><input type="radio" name="difficulty" value="medium"> Medium</label>
          <label><input type="radio" name="difficulty" value="hard"> Hard</label>
        </fieldset>
        <fieldset><legend>Mode</legend>
          <label><input type="radio" name="mode" value="solo" checked> Solo</label>
          <label><input type="radio" name="mode" value="two-player"> 2 players</label>
        </fieldset>
        <button id="restart" type="button">Restart</button>
      </div>
      <div class="scores"><div class="score-card">Player 1<strong id="score-one">0</strong></div><div id="player-two-score" class="score-card player-two hidden">Player 2<strong id="score-two">0</strong></div></div>
      <canvas id="board" width="400" height="400" tabindex="0" role="application" aria-label="Snake board. Player 1 uses W A S D. Player 2 uses arrow keys in two-player mode."></canvas>
      <p id="status" role="status">Choose a mode, then press a movement key to start.</p>
      <p class="keys">Player 1: W A S D. Player 2: Arrow keys. Click the board to focus it.</p>
    </section>
  </main>
  <script>
    const canvas = document.querySelector("#board"), ctx = canvas.getContext("2d"), size = 20;
    const scoreOneEl = document.querySelector("#score-one"), scoreTwoEl = document.querySelector("#score-two"), playerTwoScoreEl = document.querySelector("#player-two-score"), status = document.querySelector("#status");
    let players, food, timer, playing, twoPlayer, explosion;
    const speeds = { easy: 180, medium: 115, hard: 70 };
    function occupied(x, y) { return players.some(player => player.snake.some(part => part.x === x && part.y === y)); }
    function randomFood() { do { food = { x: Math.floor(Math.random() * size), y: Math.floor(Math.random() * size) }; } while (occupied(food.x, food.y)); }
    function draw() {
      ctx.fillStyle = "#0b1428"; ctx.fillRect(0, 0, 400, 400);
      ctx.strokeStyle = "#182744"; for (let i = 0; i <= size; i++) { ctx.beginPath(); ctx.moveTo(i * 20, 0); ctx.lineTo(i * 20, 400); ctx.moveTo(0, i * 20); ctx.lineTo(400, i * 20); ctx.stroke(); }
      ctx.fillStyle = "#ff5f6d"; ctx.fillRect(food.x * 20 + 3, food.y * 20 + 3, 14, 14);
      players.forEach((player, playerIndex) => player.snake.forEach((part, index) => { ctx.fillStyle = index ? player.color : player.headColor; ctx.fillRect(part.x * 20 + 2, part.y * 20 + 2, 16, 16); }));
      if (explosion) { ctx.fillStyle = "#fff2a5"; for (let i = 0; i < 10; i++) { const angle = (Math.PI * 2 * i) / 10; ctx.fillRect(explosion.x * 20 + 8 + Math.cos(angle) * 21, explosion.y * 20 + 8 + Math.sin(angle) * 21, 7, 7); } ctx.fillStyle = "#ff5f6d"; ctx.fillRect(explosion.x * 20 + 3, explosion.y * 20 + 3, 14, 14); }
    }
    function finish(playerIndex, message, hitSide) { playing = false; clearInterval(timer); explosion = hitSide ? players[playerIndex].snake[0] : null; draw(); const winner = twoPlayer ? `Player ${playerIndex === 0 ? 2 : 1} wins!` : "Game over!"; status.textContent = `${winner} ${message}`; }
    function step() {
      const heads = players.map(player => ({ x: player.snake[0].x + player.nextDirection.x, y: player.snake[0].y + player.nextDirection.y }));
      for (let index = 0; index < players.length; index++) {
        const head = heads[index], player = players[index];
        if (head.x < 0 || head.y < 0 || head.x >= size || head.y >= size) { finish(index, "The snake exploded on the side of the board!", true); return; }
        if (occupied(head.x, head.y) || heads.some((otherHead, otherIndex) => otherIndex !== index && otherHead.x === head.x && otherHead.y === head.y)) { finish(index, "The snake crashed!", false); return; }
        player.direction = player.nextDirection;
      }
      let ate = false;
      players.forEach((player, index) => {
        const head = heads[index]; player.snake.unshift(head);
        if (head.x === food.x && head.y === food.y) { player.score++; ate = true; (index === 0 ? scoreOneEl : scoreTwoEl).textContent = player.score; if (twoPlayer && player.score === 10) { finish(1 - index, `Player ${index + 1} reached 10 points!`, false); return; } } else player.snake.pop();
      });
      if (!playing) return;
      if (ate) randomFood();
      draw();
    }
    function start() { if (!playing) { playing = true; status.textContent = "Go!"; timer = setInterval(step, speeds[document.querySelector('input[name="difficulty"]:checked').value]); } }
    function reset() { clearInterval(timer); twoPlayer = document.querySelector('input[name="mode"]:checked').value === "two-player"; players = [{ snake:[{x:4,y:10},{x:3,y:10},{x:2,y:10}], direction:{x:1,y:0}, nextDirection:{x:1,y:0}, score:0, color:"#64dca5", headColor:"#ffcf3f" }]; if (twoPlayer) players.push({ snake:[{x:15,y:10},{x:16,y:10},{x:17,y:10}], direction:{x:-1,y:0}, nextDirection:{x:-1,y:0}, score:0, color:"#b783ff", headColor:"#ead8ff" }); playing = false; explosion = null; scoreOneEl.textContent = "0"; scoreTwoEl.textContent = "0"; playerTwoScoreEl.classList.toggle("hidden", !twoPlayer); randomFood(); draw(); status.textContent = twoPlayer ? "Player 1 uses W A S D. Player 2 uses arrow keys. First to 10 wins!" : "Press W, A, S, or D to start."; canvas.focus(); }
    document.addEventListener("keydown", e => { const moves = { w:[0,0,-1], W:[0,0,-1], s:[0,0,1], S:[0,0,1], a:[0,-1,0], A:[0,-1,0], d:[0,1,0], D:[0,1,0], ArrowUp:[1,0,-1], ArrowDown:[1,0,1], ArrowLeft:[1,-1,0], ArrowRight:[1,1,0] }, move = moves[e.key]; if (!move || (!twoPlayer && move[0] === 1)) return; e.preventDefault(); const [playerIndex, x, y] = move, player = players[playerIndex]; if (x !== -player.direction.x || y !== -player.direction.y) player.nextDirection = {x,y}; start(); });
    document.querySelector("#restart").addEventListener("click", reset); reset();
  </script>
</body>
</html>
