<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnet Mayhem | My Online Game</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{background:radial-gradient(circle at top,#2e5e76,#101926 72%);color:#fff;margin:0;min-height:100vh}main{margin:auto;max-width:780px;padding:24px 16px 42px;text-align:center}a{color:#ffd45a}h1{font-size:clamp(2.5rem,8vw,4.7rem);letter-spacing:-.08em;margin:14px 0 4px}.tagline{color:#c5dced}.panel{background:#122435e8;border:1px solid #ffffff35;border-radius:18px;padding:18px}canvas{background:#102c40;border:2px solid #65d8e8;border-radius:12px;display:block;width:100%}.hud{display:flex;justify-content:space-around;margin:12px}.hud strong{color:#69e8ff;display:block;font-size:1.4rem}button{background:#ffd45a;border:0;border-radius:9px;color:#17203b;cursor:pointer;font:inherit;font-weight:bold;padding:10px 16px}#status,.help{color:#c5dced;line-height:1.5;min-height:1.5em}
</style></head>
<body><main><a href="index.html">← Back to games</a><h1>Magnet Mayhem</h1><p class="tagline">Pull scrap into your magnet while dodging unstable bombs.</p><section class="panel"><button id="start" type="button">Start salvage</button><div class="hud"><div>Level<strong id="level">1</strong></div><div>Scrap<strong id="score">0</strong></div><div>Best<strong id="best">0</strong></div><div>Time<strong id="time">30</strong></div></div><canvas id="game" width="760" height="480" aria-label="Magnet Mayhem arena"></canvas><p id="status" role="status">Move with WASD or arrow keys.</p><p class="help">Collect blue scrap. Avoid red bombs. Every 8 scrap raises the level and increases danger.</p></section></main>
<script>
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),start=document.querySelector("#start"),scoreEl=document.querySelector("#score"),bestEl=document.querySelector("#best"),timeEl=document.querySelector("#time"),levelEl=document.querySelector("#level"),status=document.querySelector("#status");let player,items,active=false,last=0,clock,score=0,level=1,best=Number(localStorage.getItem("magnet-mayhem-best")||0);bestEl.textContent=best;
function randItem(){return{x:20+Math.random()*720,y:20+Math.random()*440,type:Math.random()<Math.min(.5,.15+level*.05)?"bomb":"scrap",r:Math.random()*Math.PI}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle="#1d5e75";for(let x=0;x<canvas.width;x+=38){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}items.forEach(item=>{ctx.fillStyle=item.type==="bomb"?"#f05a67":"#6ceaff";ctx.beginPath();ctx.arc(item.x,item.y,item.type==="bomb"?13:10,0,Math.PI*2);ctx.fill();if(item.type==="bomb"){ctx.fillStyle="#fff";ctx.fillRect(item.x-3,item.y-20,6,8)}});ctx.fillStyle="#ffcf4f";ctx.beginPath();ctx.arc(player.x,player.y,20,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x,player.y,29,0,Math.PI);ctx.stroke();ctx.lineWidth=1}
function frame(time){if(!active)return;const dt=Math.min((time-last)/1000,.05);last=time;const speed=180+level*35;const dx=((keys.has("ArrowRight")||keys.has("d"))?1:0)-((keys.has("ArrowLeft")||keys.has("a"))?1:0),dy=((keys.has("ArrowDown")||keys.has("s"))?1:0)-((keys.has("ArrowUp")||keys.has("w"))?1:0);player.x=Math.max(22,Math.min(738,player.x+dx*speed*dt));player.y=Math.max(22,Math.min(458,player.y+dy*speed*dt));items.forEach(item=>item.r+=dt*3);items=items.filter(item=>{if(Math.hypot(item.x-player.x,item.y-player.y)<30){if(item.type==="bomb"){end("Boom! A bomb ended the salvage run.");return false}score++;level=Math.min(5,1+Math.floor(score/8));levelEl.textContent=level;scoreEl.textContent=score;status.textContent=`Scrap secured! Level ${level}.`;return false}return true});while(items.length<8+level)items.push(randItem());draw();requestAnimationFrame(frame)}
function end(message){active=false;clearInterval(clock);best=Math.max(best,score);localStorage.setItem("magnet-mayhem-best",best);bestEl.textContent=best;status.textContent=`${message} Score: ${score}.`;start.textContent="Salvage again"}
function startGame(){score=0;level=1;scoreEl.textContent=0;levelEl.textContent=1;timeEl.textContent=30;player={x:380,y:240};items=Array.from({length:9},randItem);active=true;start.textContent="Restart";status.textContent="Collect scrap, avoid bombs!";clearInterval(clock);clock=setInterval(()=>{const time=Number(timeEl.textContent)-1;timeEl.textContent=time;if(time<=0)end("Time up!");},1000);last=performance.now();requestAnimationFrame(frame)}
const keys=new Set();document.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","a","s","d"].includes(e.key)||["W","A","S","D"].includes(e.key)){keys.add(e.key.toLowerCase());e.preventDefault()}});document.addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));start.addEventListener("click",startGame);draw();
</script></body></html>
