<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-a-Mole | My Online Game</title>
  <style>
    :root { color-scheme: dark; font-family: Arial,sans-serif; } * { box-sizing:border-box; } body { background:radial-gradient(circle at top,#25437a,#10172b 65%); color:#f8fbff; margin:0; min-height:100vh; }
    main { margin:auto; max-width:650px; padding:28px 18px 40px; text-align:center; } a { color:#ffcf3f; } .panel { background:rgba(20,31,58,.88); border:1px solid #ffffff2e; border-radius:18px; padding:18px; } .controls { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center; margin:14px 0; }
    fieldset { border:0; margin:0; padding:0; } label { cursor:pointer; } button { border:0; border-radius:10px; cursor:pointer; font:inherit; font-weight:bold; padding:10px 15px; } #start { background:#ffcf3f; color:#17203b; } button:focus-visible { outline:3px solid white; outline-offset:2px; }
    #holes { display:grid; gap:12px; grid-template-columns:repeat(3,1fr); margin:20px auto; max-width:480px; } .hole { aspect-ratio:1; background:#0a1325; border:3px solid #4672b8; border-radius:50%; color:transparent; font-size:clamp(2rem,10vw,4rem); padding:0; } .hole.active { background:#715142; color:#ffcf3f; transform:scale(1.04); } #status { min-height:1.5em; color:#c8d5f0; }
  </style>
</head>
<body><main>
  <a href="index.html">← Back to games</a><h1>Whack-a-Mole</h1><p>Whack the mole as often as you can before time runs out.</p>
  <section class="panel" aria-label="Whack-a-Mole game"><div class="controls"><fieldset><legend>Difficulty</legend><label><input type="radio" name="difficulty" value="easy" checked> Easy</label> <label><input type="radio" name="difficulty" value="medium"> Medium</label> <label><input type="radio" name="difficulty" value="hard"> Hard</label></fieldset><button id="start" type="button">Start game</button></div>
  <p><strong>Score: <span id="score">0</span></strong> · <strong>Time: <span id="time">30</span>s</strong></p><div id="holes" aria-label="Mole holes"></div><p id="status" role="status">Choose a difficulty, then start.</p></section>
  </main><script>
    const holes = document.querySelector("#holes"), scoreEl = document.querySelector("#score"), timeEl = document.querySelector("#time"), status = document.querySelector("#status");
    const settings = { easy:{time:30,show:1100}, medium:{time:25,show:700}, hard:{time:20,show:420} }; let score, remaining, mole, game, clock;
    for(let i=0;i<9;i++) { const b=document.createElement("button"); b.type="button"; b.className="hole"; b.setAttribute("aria-label",`Hole ${i+1}`); b.textContent="🐹"; b.addEventListener("click",()=>{if(game && b===mole){score++;scoreEl.textContent=score; showMole();}}); holes.append(b); }
    const buttons=[...document.querySelectorAll(".hole")];
    function showMole(){ buttons.forEach(b=>b.classList.remove("active")); mole=buttons[Math.floor(Math.random()*buttons.length)]; mole.classList.add("active"); }
    function end(){ game=false; clearInterval(clock); buttons.forEach(b=>b.classList.remove("active")); status.textContent=`Time! You whacked ${score} mole${score===1?"":"s"}.`; document.querySelector("#start").textContent="Play again"; }
    document.querySelector("#start").addEventListener("click",()=>{ const s=settings[document.querySelector('input[name="difficulty"]:checked').value]; clearInterval(clock); game=true; score=0;remaining=s.time;scoreEl.textContent=score;timeEl.textContent=remaining;status.textContent="Whack the active mole!";document.querySelector("#start").textContent="Restart game";showMole();clock=setInterval(()=>{if(!game)return;remaining--;timeEl.textContent=remaining;if(!remaining)return end();showMole();},s.show);});
  </script></body></html>
