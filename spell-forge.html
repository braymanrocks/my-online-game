<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spell Forge | My Online Game</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{background:radial-gradient(circle at top,#653b87,#15152b 72%);color:#fff;margin:0;min-height:100vh}main{margin:auto;max-width:650px;padding:24px 16px 42px;text-align:center}a{color:#ffd45a}h1{font-size:clamp(2.5rem,8vw,4.7rem);letter-spacing:-.08em;margin:14px 0 4px}.tagline{color:#e0ccef}.panel{background:#211b3be8;border:1px solid #ffffff35;border-radius:18px;padding:20px}.stats{display:flex;justify-content:space-around;margin:12px}.stats strong{color:#ffdc75;display:block;font-size:1.4rem}.runes{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin:24px auto;max-width:420px}.rune{aspect-ratio:1;border:0;border-radius:18px;cursor:pointer;font-size:2.5rem;transition:transform .12s,filter .12s}.rune:active{transform:scale(.9)}.rune:nth-child(1){background:#e55569}.rune:nth-child(2){background:#4cb5e7}.rune:nth-child(3){background:#9e69e8}.rune:nth-child(4){background:#e4a948}.rune.flash{filter:brightness(1.8);transform:scale(1.07)}button#start{background:#ffd45a;border:0;border-radius:9px;color:#17203b;cursor:pointer;font:inherit;font-weight:bold;padding:10px 16px}.help,#status{color:#e0ccef;line-height:1.5;min-height:1.5em}
</style></head>
<body><main><a href="index.html">← Back to games</a><h1>Spell Forge</h1><p class="tagline">Memorize the rune chain and cast the biggest spell.</p><section class="panel"><button id="start" type="button">Start forging</button><div class="stats"><div>Level<strong id="level">1</strong></div><div>Round<strong id="round">0</strong></div><div>Combo<strong id="combo">0</strong></div><div>Best<strong id="best">0</strong></div></div><div id="runes" class="runes" aria-label="Four magic runes"><button class="rune" data-rune="0" type="button">🔥</button><button class="rune" data-rune="1" type="button">❄️</button><button class="rune" data-rune="2" type="button">🌙</button><button class="rune" data-rune="3" type="button">⚡</button></div><p id="status" role="status">Press Start forging to reveal a spell.</p><p class="help">Watch the runes, then repeat the sequence. One mistake ends the spell. Higher levels flash faster.</p></section></main>
<script>
const buttons=[...document.querySelectorAll(".rune")],start=document.querySelector("#start"),status=document.querySelector("#status"),levelEl=document.querySelector("#level"),roundEl=document.querySelector("#round"),comboEl=document.querySelector("#combo"),bestEl=document.querySelector("#best");let sequence=[],input=[],round=0,level=1,combo=0,active=false,best=Number(localStorage.getItem("spell-forge-best")||0);bestEl.textContent=best;
function flash(index){buttons[index].classList.add("flash");setTimeout(()=>buttons[index].classList.remove("flash"),300)}
function showSequence(){status.textContent="Memorize!";input=[];const delay=Math.max(180,450-level*45);sequence.forEach((value,index)=>setTimeout(()=>flash(value),delay*index+250));setTimeout(()=>status.textContent="Your turn!",delay*sequence.length+300)}
function nextRound(){round++;level=Math.ceil(round/3);levelEl.textContent=level;roundEl.textContent=round;sequence.push(Math.floor(Math.random()*4));showSequence()}
function finish(){active=false;best=Math.max(best,combo);localStorage.setItem("spell-forge-best",best);bestEl.textContent=best;start.textContent="Forge again";status.textContent=`Spell fizzled at round ${round}. Best combo: ${best}.`}
function clickRune(index){if(!active||input.length>=sequence.length)return;flash(index);input.push(index);if(index!==sequence[input.length-1])return finish();if(input.length===sequence.length){combo++;comboEl.textContent=combo;status.textContent="Perfect!";setTimeout(nextRound,500)}}
function startGame(){sequence=[];input=[];round=0;level=1;combo=0;active=true;levelEl.textContent=1;roundEl.textContent=0;comboEl.textContent=0;start.textContent="Restart";nextRound()}
buttons.forEach((button,index)=>button.addEventListener("click",()=>clickRune(index)));start.addEventListener("click",startGame);
</script></body></html>
