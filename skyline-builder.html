<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline Builder | My Online Game</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{background:linear-gradient(#142b55,#1a1830);color:#fff;margin:0;min-height:100vh}main{margin:auto;max-width:820px;padding:24px 16px 42px;text-align:center}a{color:#ffd45a}h1{font-size:clamp(2.5rem,8vw,4.7rem);letter-spacing:-.08em;margin:14px 0 4px}.tagline{color:#c6d6ef}.panel{background:#101a31e8;border:1px solid #ffffff35;border-radius:18px;padding:18px}canvas{background:linear-gradient(#203d70,#8c5b9c 68%,#e0a45f 69%);border:2px solid #7691c3;border-radius:12px;display:block;width:100%}button{background:#ffd45a;border:0;border-radius:9px;color:#17203b;cursor:pointer;font:inherit;font-weight:bold;padding:10px 16px}#status{color:#c6d6ef;min-height:1.5em}.help{color:#c6d6ef;line-height:1.5}
</style></head>
<body><main><a href="index.html">← Back to games</a><h1>Skyline Builder</h1><p class="tagline">Drop each floor perfectly and build the tallest city.</p><section class="panel"><button id="start" type="button">Start building</button><p>Level <strong id="level">1</strong> · Every 5 floors gets faster</p><canvas id="city" width="800" height="500" aria-label="Skyline stacking game"></canvas><p id="status" role="status">Press Start building, then press Space or click to drop a floor.</p><p class="help">Stack 20 floors. Perfect drops earn bonus points; misses make the building narrower.</p></section></main>
<script>
const canvas=document.querySelector("#city"),ctx=canvas.getContext("2d"),start=document.querySelector("#start"),status=document.querySelector("#status"),levelEl=document.querySelector("#level");let active=false,blocks=[],moving,score=0,level=1,animation,lastTime=0;
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#f8d57a";ctx.beginPath();ctx.arc(670,95,34,0,Math.PI*2);ctx.fill();blocks.forEach((block,index)=>{ctx.fillStyle=block.color;ctx.fillRect(block.x,430-(index+1)*20,block.width,20);ctx.strokeStyle="#202945";ctx.strokeRect(block.x,430-(index+1)*20,block.width,20)});if(moving){ctx.fillStyle=moving.color;ctx.fillRect(moving.x,430-(blocks.length+1)*20,moving.width,20);ctx.strokeStyle="#fff";ctx.strokeRect(moving.x,430-(blocks.length+1)*20,moving.width,20)}}
function loop(time){if(!active)return;const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;moving.x+=moving.direction*(220+level*45)*dt;if(moving.x<20||moving.x+moving.width>780)moving.direction*=-1;draw();animation=requestAnimationFrame(loop)}
function drop(){if(!active||!moving)return;const below=blocks[blocks.length-1],left=below?Math.max(moving.x,below.x):moving.x,right=below?Math.min(moving.x+moving.width,below.x+below.width):moving.x+moving.width,width=right-left;if(width<18){active=false;status.textContent=`The tower fell at floor ${blocks.length}. Score: ${score}.`;return}score+=Math.round(width);if(width===moving.width)score+=50;blocks.push({x:left,width,color:`hsl(${(blocks.length*38)%360} 70% 58%)`});level=Math.min(4,1+Math.floor(blocks.length/5));levelEl.textContent=level;if(blocks.length>=20){active=false;status.textContent=`Skyline complete! Final score: ${score}.`;return}moving={x:20,width,direction:1,color:`hsl(${(blocks.length*38)%360} 70% 58%)`};status.textContent=`Floor ${blocks.length}/20 · Level ${level}. Drop it!`}
function startGame(){cancelAnimationFrame(animation);blocks=[];score=0;level=1;levelEl.textContent=1;active=true;start.textContent="Restart";moving={x:20,width:300,direction:1,color:"#ef6b75"};status.textContent="Drop the first floor!";lastTime=performance.now();animation=requestAnimationFrame(loop)}
start.addEventListener("click",startGame);canvas.addEventListener("click",drop);document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();drop()}});draw();
</script></body></html>
