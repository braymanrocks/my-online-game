<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cannon Clash | My Online Game</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{background:radial-gradient(circle at top,#70402d,#151827 70%);color:#fff;margin:0;min-height:100vh}main{margin:auto;max-width:860px;padding:24px 16px 42px;text-align:center}a{color:#ffd45a}h1{font-size:clamp(2.5rem,8vw,4.8rem);letter-spacing:-.08em;margin:14px 0 4px}.tagline{color:#f3cdb3}.panel{background:#241b2be8;border:1px solid #ffffff35;border-radius:18px;padding:18px}canvas{background:linear-gradient(#f59e70,#f9d77d 58%,#6a9a62 59%);border:2px solid #d59a70;border-radius:12px;display:block;width:100%}.controls{align-items:center;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:15px 0}label{color:#f3cdb3}input{accent-color:#ffd45a;width:150px}button{background:#ffd45a;border:0;border-radius:9px;color:#2a1b22;cursor:pointer;font:inherit;font-weight:bold;padding:10px 16px}button:focus-visible{outline:3px solid white;outline-offset:3px}#status{color:#f3cdb3;min-height:1.5em}
</style>
</head>
<body><main><a href="index.html">← Back to games</a><h1>Cannon Clash</h1><p class="tagline">Aim, fire, and land the perfect shot.</p><section class="panel"><button id="start" type="button">Start match</button><p>Level <strong id="level">1</strong> · Hit 3 targets to level up</p><canvas id="game" width="800" height="420" aria-label="Cannon Clash battlefield"></canvas><div class="controls"><label>Angle <input id="angle" type="range" min="15" max="75" value="45"><output id="angle-value">45°</output></label><label>Power <input id="power" type="range" min="25" max="100" value="65"><output id="power-value">65</output></label><button id="fire" type="button" disabled>Fire!</button></div><p id="status" role="status">Start the match to load a target.</p></section></main>
<script>
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),start=document.querySelector("#start"),fire=document.querySelector("#fire"),status=document.querySelector("#status"),angle=document.querySelector("#angle"),power=document.querySelector("#power"),angleValue=document.querySelector("#angle-value"),powerValue=document.querySelector("#power-value"),levelEl=document.querySelector("#level");let targetX=650,score=0,shots=0,level=1,levelHits=0,active=false,projectile=null,frameId;
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#3f7a4c";ctx.fillRect(0,330,canvas.width,90);const radius=Math.max(7,14-level);ctx.fillStyle="#bd4940";ctx.fillRect(targetX-24,290,48,40);ctx.fillStyle="#ffd45a";ctx.beginPath();ctx.arc(targetX,280,radius,0,Math.PI*2);ctx.fill();ctx.fillStyle="#4a2d24";ctx.fillRect(55,300,70,30);ctx.save();ctx.translate(105,300);ctx.rotate(-Number(angle.value)*Math.PI/180);ctx.fillRect(0,-10,58,20);ctx.restore();if(projectile){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(projectile.x,projectile.y,7,0,Math.PI*2);ctx.fill()}}
function updateLabels(){angleValue.value=`${angle.value}°`;powerValue.value=power.value}
function startGame(){score=0;shots=0;level=1;levelHits=0;active=true;projectile=null;fire.disabled=false;levelEl.textContent=level;start.textContent="Restart match";status.textContent="Hit the target!";targetX=500+Math.random()*240;draw()}
function finishShot(hit){shots++;if(hit){score++;levelHits++;if(levelHits>=3){level++;levelHits=0;status.textContent=`Level ${level}! The target is smaller now.`}else status.textContent=`Direct hit! Score ${score}.`}else status.textContent="Miss! Adjust your angle or power.";targetX=420+Math.random()*300;levelEl.textContent=level;projectile=null;if(shots>=15){active=false;fire.disabled=true;status.textContent=`Match over: ${score} / 15 targets hit.`}draw()}
function launch(){if(!active||projectile)return;const radians=Number(angle.value)*Math.PI/180;projectile={x:105,y:300,vx:Number(power.value)*Math.cos(radians)*.12,vy:-Number(power.value)*Math.sin(radians)*.12};animate()}
function animate(){if(!projectile)return;projectile.x+=projectile.vx;projectile.y+=projectile.vy;projectile.vy+=.18;draw();if(projectile.x>canvas.width||projectile.y>330){finishShot(Math.abs(projectile.x-targetX)<Math.max(14,38-level*4)&&projectile.y>245);return}frameId=requestAnimationFrame(animate)}
angle.addEventListener("input",()=>{updateLabels();draw()});power.addEventListener("input",()=>{updateLabels();draw()});start.addEventListener("click",startGame);fire.addEventListener("click",launch);updateLabels();draw();
</script></body></html>
